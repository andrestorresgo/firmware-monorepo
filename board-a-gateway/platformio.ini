; PlatformIO Project Configuration File
; Board A: Gateway, Local Authentication Terminal, and Cloud MQTT Bridge

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    olikraus/U8g2 @ ^2.36.5
    chris--a/Keypad @ ^3.1.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.3.1

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++17
    -DUNIT_TEST
