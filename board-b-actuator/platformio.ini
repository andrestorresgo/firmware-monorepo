; PlatformIO Project Configuration File
; Board B: Actuator, Binary LED Counters, Physical Actuation, and Machine Pause

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = 
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
    bblanchon/ArduinoJson @ ^7.3.1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = 
    -std=c++17
    -DUNIT_TEST

